appId: host.exp.exponent
name: company
env:
  BASE: exp://192.168.10.206:8081/--
---
- stopApp
- openLink: ${BASE}/c/GP
- extendedWaitUntil:
    visible: "52-week range"
    timeout: 90000
- assertVisible: "Grameenphone.*"
- assertVisible: "৳[0-9,]+\\.[0-9]{2}"
- takeScreenshot: company-01-price
- scrollUntilVisible:
    element: "Four questions before you buy"
    direction: DOWN
- scrollUntilVisible:
    element: "1Y"
    direction: DOWN
    centerElement: true
- tapOn: "1W"
- assertVisible: { text: "1W", selected: true }
- tapOn: "1M"
- assertVisible: { text: "1M", selected: true }
- tapOn: "3M"
- assertVisible: { text: "3M", selected: true }
- tapOn: "6M"
- assertVisible: { text: "6M", selected: true }
- tapOn: "1Y"
- assertVisible: { text: "1Y", selected: true }
- takeScreenshot: company-02-range-chips
- scrollUntilVisible:
    element: "Key facts"
    direction: DOWN
- scrollUntilVisible:
    element: "Financial trends"
    direction: DOWN
- takeScreenshot: company-03-financial-trends
- scrollUntilVisible:
    element: "Who owns the shares"
    direction: DOWN
    centerElement: true
- takeScreenshot: company-04-share-holding
# Star toggles the watchlist; end state = not saved
- runFlow: _hide-devtools.yaml
- runFlow:
    when:
      visible: "Remove from watchlist"
    commands:
      - tapOn: "Remove from watchlist"
- tapOn: "Save to watchlist"
- extendedWaitUntil:
    visible: "Remove from watchlist"
    timeout: 5000
- takeScreenshot: company-05-star-saved
- tapOn: "Remove from watchlist"
- extendedWaitUntil:
    visible: "Save to watchlist"
    timeout: 5000
