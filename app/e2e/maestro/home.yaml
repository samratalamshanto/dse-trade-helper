appId: host.exp.exponent
name: home
env:
  BASE: exp://192.168.10.206:8081/--
---
- stopApp
- openLink: ${BASE}/
- extendedWaitUntil:
    visible: "DSEX index"
    timeout: 90000
- assertVisible: "Market (open|closed)|● Market open"
- takeScreenshot: home-01-market
- scrollUntilVisible:
    element: ".*companies checked"
    direction: DOWN
# Movers: switch gainers -> losers -> gainers
- scrollUntilVisible:
    element: "Top losers"
    direction: DOWN
- tapOn: "Top losers"
- assertVisible:
    text: "Top losers"
    selected: true
- takeScreenshot: home-02-top-losers
- tapOn: "Top gainers"
- assertVisible:
    text: "Top gainers"
    selected: true
# Signal count card -> Companies filtered
- scrollUntilVisible:
    element: ".*Passes the checks, Passes all 8 rule checks.*"
    direction: DOWN
- tapOn: ".*Passes the checks, Passes all 8 rule checks.*"
- extendedWaitUntil:
    visible: ".*compan(y|ies) · Passes all 8 rule checks and has no warning sign\\."
    timeout: 30000
- assertVisible:
    text: "Passes the checks"
    selected: true
- takeScreenshot: home-03-companies-filtered
# Bottom tabs
- tapOn: ".*Watchlist"
- extendedWaitUntil:
    visible: "Watchlist"
    timeout: 15000
- tapOn: ".*Trades"
- extendedWaitUntil:
    visible: "My trades"
    timeout: 30000
- tapOn: "More"   # exact tab label (renamed from "Learn"; it now holds the theme switch)
- extendedWaitUntil:
    visible: "Settings and help"
    timeout: 15000
- tapOn: ".*Companies"
- extendedWaitUntil:
    visible: "Search companies"
    timeout: 15000
- tapOn: ".*Home"
- scrollUntilVisible:
    element: "DSEX index"
    direction: UP
    timeout: 30000
- takeScreenshot: home-04-tabs-back-home
