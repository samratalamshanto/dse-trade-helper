name: Telegram alerts

on:
  schedule:
    - cron: '*/5 3-8 * * 0-4' # 09:00-14:55 Dhaka, Sunday to Thursday; the script skips minutes outside 09:30-15:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-alerts
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The sent-alert list survives between runs in the Actions cache, so each alert goes out once.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: web/data/notify-state.json
          key: notify-state-${{ github.run_id }}
          restore-keys: notify-state-
      - run: node scripts/notify-once.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Per-user alerts: decrypt each user's Google token from the registry tab and refresh it.
          TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always() && hashFiles('web/data/notify-state.json') != ''
        with:
          path: web/data/notify-state.json
          key: notify-state-${{ github.run_id }}
