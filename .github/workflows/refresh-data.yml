name: Refresh DSE data

on:
  schedule:
    - cron: '30 9 * * 0-4' # 15:30 Dhaka, Sunday to Thursday, after the 14:30 close
  workflow_dispatch:
  # A parser change (DATA_VERSION in web/lib/company.ts) needs new saved data at once, not at the next close.
  push:
    branches: [main]
    paths: ['web/lib/company.ts']

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node scripts/refresh-data.ts
      - name: Commit the new data
        run: |
          git config user.name "dse-data-bot"
          git config user.email "dse-data-bot@users.noreply.github.com"
          git add data/companies.json data/last-session.json data/scorecard
          git diff --cached --quiet && { echo "No data change"; exit 0; }
          git commit -m "chore: refresh DSE data $(date -u +%F)"
          git pull --rebase origin "$GITHUB_REF_NAME" && git push # main may have moved during the ~25 min run
